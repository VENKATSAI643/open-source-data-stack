name: 'nyc_taxi_dbt'
version: '1.0.0'
config-version: 2

profile: 'nyc_taxi_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi_dbt:
    # Disable boilerplate example models generated by dbt init
    example:
      +enabled: false

    # Staging: lightweight views — no +schema override, inherits profile schema (nyc_taxi_marts)
    staging:
      +materialized: view

    # Intermediate: views — joins and derived fields only
    intermediate:
      +materialized: view

    # Marts: physical tables with ClickHouse-specific engine configs
    marts:
      +materialized: table
