# Marquez server configuration
# Matches the official Marquez docker-compose pattern
# Environment variables (set in governance-compose.yml) are substituted at runtime

server:
  applicationConnectors:
    - type: http
      port: ${MARQUEZ_PORT:-5000}
  adminConnectors:
    - type: http
      port: ${MARQUEZ_ADMIN_PORT:-5001}

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-marquez}
  user: ${POSTGRES_USER:-marquez}
  password: ${POSTGRES_PASSWORD:-marquez}
  properties:
    charSet: UTF-8
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  validationQueryTimeout: 3s
  minSize: 2
  maxSize: 8
  checkConnectionWhileIdle: false
  evictionInterval: 10s
  minIdleTime: 1 minute

migrateOnStartup: true

logging:
  level: INFO
  appenders:
    - type: console
